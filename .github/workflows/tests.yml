name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g @stoplight/spectral-cli@6
      - run: pip install -e ".[test]"
      - run: pytest -q
      # the generated definitions of the starter model and the examples pass the starter style rules
      - run: |
          api-definition-studio add-example agreements --data ci-data
          api-definition-studio add-example notes --data ci-data
          api-definition-studio lint --data ci-data --fail-on warning
